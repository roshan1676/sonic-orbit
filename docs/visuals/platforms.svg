<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title"><title id="title">Four SonicOrbit packages with a shared core</title><rect width="1200" height="250" rx="18" fill="#141b11"/><g font-family="Segoe UI,Arial,sans-serif"><g fill="#c0daa7" font-size="13" letter-spacing="3"><text x="36" y="45">01 / WINDOWS</text><text x="336" y="45">02 / BROWSER</text><text x="636" y="45">03 / ANDROID</text><text x="936" y="45">04 / DEVELOPERS</text></g><g fill="#ecf0e5" font-size="26"><text x="36" y="104">Your listening room</text><text x="336" y="104">Your selected tab</text><text x="636" y="104">Your local files</text><text x="936" y="104">Your own app</text></g><g fill="#a8b79b" font-size="15"><text x="36" y="148">Video + music player</text><text x="36" y="178">Camera tracking + optional AI</text><text x="336" y="148">Chrome / Edge / Brave</text><text x="336" y="178">Explicit tab audio capture</text><text x="636" y="148">Foreground music + video</text><text x="636" y="178">Android 8+ · WebView renderer</text><text x="936" y="148">ES module + type definitions</text><text x="936" y="178">3D sources + listener pose</text></g><path d="M300 32V212M600 32V212M900 32V212" stroke="#35452b"/></g></svg>
