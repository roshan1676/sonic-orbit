<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
<title id="title">SonicOrbit — Turn sound into space.</title><desc id="desc">A local spatial audio toolkit for headphones, with a singer and instrument sources positioned around a listener.</desc>
<rect width="1440" height="620" rx="24" fill="#11180f"/><path d="M54 76H1386M54 546H1386" stroke="#35422e"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="64" y="56" fill="#bdd6a6" font-size="15" letter-spacing="5">SONICORBIT</text><text x="1374" y="56" fill="#9ca991" font-size="13" text-anchor="end" letter-spacing="2">LOCAL AUDIO / ALPHA 01</text>
<text x="64" y="210" fill="#eff2e8" font-size="76" font-weight="500" letter-spacing="-4">Turn sound</text><text x="64" y="296" fill="#c1dda6" font-size="76" font-weight="500" letter-spacing="-4">into space.</text>
<text x="68" y="354" fill="#b5c0ac" font-size="22">Your media. Your headphones. Your listening room.</text>
<text x="68" y="451" fill="#b7c7a7" font-size="14" letter-spacing="2">PLAYER  /  EXTENSION  /  ANDROID  /  WEB SDK</text>
<text x="68" y="580" fill="#89977e" font-size="13">MIT licensed · Local processing · Original audio always available</text>
<text x="1374" y="580" fill="#89977e" font-size="13" text-anchor="end">A spatial remix toolkit. Built to explore.</text></g>
